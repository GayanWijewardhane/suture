# Suture Configuration File

[general]
# Enable colored output
color = true

# Default severity threshold for alerts
severity_threshold = medium

# Maximum log file size to analyze (in MB)
max_log_size = 100

[monitoring]
# Default check interval (seconds)
interval = 2

# Enable notifications
notifications = false

# Alert on critical errors only
alert_critical_only = false

[fixing]
# Require confirmation before executing fixes
require_confirmation = true

# Create backups before modifications
create_backups = true

# Dry run mode by default
dry_run = false

[health]
# Health check schedule (cron format)
schedule = 0 */6 * * *

# Services to always check
critical_services = sshd,NetworkManager,firewalld

[rules]
# Custom rules directory
custom_rules_dir = ~/.config/suture/rules

# Auto-update rules
auto_update_rules = false
